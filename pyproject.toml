[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trpg-cli"
version = "0.1.0"
description = "Terminal HTTP client for NightTable tabletop rooms"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
nighttable = "nighttable_cli.client:main"

[tool.setuptools.packages.find]
include = ["nighttable_cli*"]

[tool.setuptools.package-data]
nighttable_cli = ["protocol.json"]
