[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trpg-cli"
version = "0.1.0"
description = "Terminal HTTP client for NightTable tabletop rooms"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
nighttable = "nighttable_cli.client:main"

[tool.setuptools.packages.find]
include = ["nighttable_cli*"]

[tool.setuptools.package-data]
nighttable_cli = ["protocol.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
