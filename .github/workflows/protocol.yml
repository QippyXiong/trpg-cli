name: TypeScript CLI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cli:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download pinned public protocol
        shell: bash
        run: curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 90 --output protocol.tgz "$(node -p "require('./protocol-release.json').url")"
      - name: Verify public artifact and lock
        run: node scripts/check-release.mjs protocol.tgz
      - name: Seed verified contract into the local npm cache
        run: npm cache add ./protocol.tgz --ignore-scripts
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run protocol:check
      - run: npm test
      - name: Verify packaged CLI installs offline and runs outside source
        run: npm run test:package
      - name: Reuse a PowerShell-created session directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sessionPath = Join-Path $env:RUNNER_TEMP "nighttable-ts-session"
          New-Item -ItemType Directory -Force -Path $sessionPath | Out-Null
          node --input-type=module -e "import {Client} from './dist/index.js'; const c=await Client.create('http://127.0.0.1:8765',process.argv[1]); await c.save(); await Client.create('http://127.0.0.1:8765',process.argv[1]); console.log('Session directory and saved cookie reopened')" "$sessionPath"
