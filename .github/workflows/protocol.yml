name: Shared protocol consistency
on: [push, pull_request]
permissions:
  contents: read
  packages: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@xiong'
      - name: Require a released version, never a local fallback
        run: node -e 'const p=require("./package.json"); if(p.dependencies["@xiong/trpg-protocol"]!=="0.1.0") throw Error("CI requires the independently released 0.1.0 protocol");'
      - name: Verify real registry read access
        run: npm view @xiong/trpg-protocol@0.1.0 version --registry=https://npm.pkg.github.com --prefer-online
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || github.token }}
      - run: npm install --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || github.token }}
      - run: npm run protocol:check
