name: Release protocol consistency
on: [push, pull_request]
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download pinned public protocol release
        run: curl --fail --location --proto '=https' --tlsv1.2 --retry 2 --max-time 90 --output protocol.tgz "$(node -p "require('./protocol-release.json').url")"
      - name: Verify release checksum and lock source
        run: node scripts/check-release.mjs protocol.tgz
      - name: Install the verified artifact without registry credentials
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund ./protocol.tgz
      - name: Verify installed package identity
        run: node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("node_modules/@qippyxiong/trpg-protocol/package.json"));const pin=require("./protocol-release.json");if(p.name!==pin.package||p.version!==pin.version||p.license!=="MIT")throw Error("Installed artifact metadata mismatch");'
      - run: npm run protocol:check
      - run: npm run test --if-present

  cli-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install Python CLI with test dependencies
        run: python -m pip install '.[test]'
      - name: Test the standalone checkout
        run: python -m pytest -q -rs
      - name: Run installed entry point outside the source tree
        working-directory: ${{ runner.temp }}
        run: nighttable --help
