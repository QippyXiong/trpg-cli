name: Shared protocol consistency
on: [push, pull_request]
permissions:
  contents: read
  packages: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@xiong'
      # Requires the separately published protocol version.
      - run: npm install --ignore-scripts --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || github.token }}
      - run: npm run protocol:check
